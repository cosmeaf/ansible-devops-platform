<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Ansible DevOps Platform</title>
</head>
<body>
  <main>
    <h1>Ansible DevOps Platform</h1>
    {% if form.errors %}<p role="alert">Invalid credentials.</p>{% endif %}
    <form method="post">{% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
