name: Dependency Review

# Flags a pull request that introduces a dependency with a known vulnerability,
# before it reaches main.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # Copyleft licences are incompatible with this project's Apache-2.0
          # distribution terms.
          deny-licenses: GPL-3.0, AGPL-3.0
