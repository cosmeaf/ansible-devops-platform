name: Release

# Runs on a semver tag. The full test suite runs again before anything is
# published — a green CI run on main is not a guarantee that the tagged commit
# is good.
#
# `latest` is applied only to a stable release. Pre-releases (v0.1.0-rc1,
# v0.1.0-dev) publish their version tag and nothing else, so `docker pull
# ...:latest` never silently hands someone a pre-release.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ansible-api

jobs:
  verify:
    name: Verify the tagged commit
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ansible_platform
          POSTGRES_USER: ansible_platform
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ansible_platform -d ansible_platform"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20

    env:
      DJANGO_SECRET_KEY: ci-only-key-not-used-anywhere-else
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      POSTGRES_DB: ansible_platform
      POSTGRES_USER: ansible_platform
      POSTGRES_PASSWORD: ci-postgres-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"

    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Resolve and validate the version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(tr -d '[:space:]' < VERSION)"
          echo "tag=$tag  VERSION=$file"
          if [ "$tag" != "$file" ]; then
            echo "::error::Tag ($tag) does not match the VERSION file ($file)."
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          if echo "$tag" | grep -q -- '-'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Django checks
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Tests
        run: pytest

  publish:
    name: Publish the image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.verify.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.verify.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.title=Ansible DevOps Platform API
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/django/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create the GitHub release
    needs: [verify, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ needs.verify.outputs.version }}
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
          generate_release_notes: true
          body: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/v${{ needs.verify.outputs.version }}/CHANGELOG.md).

            ## Container image

            ```bash
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.verify.outputs.version }}
            ```
